<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['IBM Plex Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            mono: ['IBM Plex Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            coral: '#ff7f50',
          },
        }
      }
    }
  </script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0a09')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .mono {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
    }

    ::selection {
      background-color: #1c1917;
      color: #fafaf9;
    }

    .dark ::selection {
      background-color: #e7e5e4;
      color: #0c0a09;
    }

    /* No visible scrollbars anywhere — panels still scroll normally */
    * {
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    /* Reveal on load — subtle fade + lift, staggered via --d */
    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        /* `none` (not translateY(0)) so the filled end value doesn't create a
           stacking context that would trap hover-preview cards under later sections */
        transform: none;
      }
    }

    .reveal {
      opacity: 0;
      animation: reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Scroll reveal — applied by <Reveal> when the block enters the viewport */
    .sreveal {
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sreveal.is-visible {
      opacity: 1;
      transform: none;
    }

    /* Experience accordion — quick ease-out expand, slow settle on collapse.
       Explicit CSS (not utility classes) so duration/easing can't be lost to
       stylesheet ordering. */
    .accordion {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .accordion.open {
      grid-template-rows: 1fr;
      transition-duration: 0.3s;
    }

    /* Typing cursor for the hero name */
    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .animate-blink {
      animation: blink 1.06s step-end infinite;
    }

    /* Project modal entrance */
    @keyframes modal-fade {
      from {
        opacity: 0;
      }
    }

    @keyframes modal-pop {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(10px);
      }
    }

    .modal-fade {
      animation: modal-fade 0.2s ease-out;
    }

    .modal-pop {
      animation: modal-pop 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal,
      .modal-fade,
      .modal-pop {
        animation: none;
        opacity: 1;
      }

      .sreveal {
        transition: none;
        opacity: 1;
        transform: none;
      }

      .aperture,
      .transition-transform {
        transition-duration: 0.01ms !important;
      }

      * {
        scroll-behavior: auto !important;
      }
    }

    /* Camera aperture mark — blades drift open on hover */
    .aperture {
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .group:hover .aperture {
      transform: rotate(60deg);
    }

    /* Theme switch — circular reveal wiping from the toggle (View Transitions) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-old(root) {
      z-index: 1;
    }

    ::view-transition-new(root) {
      z-index: 9999;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
</head>
